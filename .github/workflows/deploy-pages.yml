name: Deploy Slides to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Stage public GitHub Pages site
        run: |
          rm -rf _site
          mkdir -p _site/kiberdrosibas-risinajumi-2-diena/handouts

          cp site/index.html _site/index.html
          cp site/404.html _site/404.html
          touch _site/.nojekyll

          cp output/kiberdrosibas-risinajumi-2-diena/index.html _site/kiberdrosibas-risinajumi-2-diena/index.html
          cp output/kiberdrosibas-risinajumi-2-diena/handouts/dalibnieku-darba-lapas.html _site/kiberdrosibas-risinajumi-2-diena/handouts/dalibnieku-darba-lapas.html

      - name: Verify security exclusions and staged files
        run: |
          if [ -n "$(find _site -iname '*atslega*' -print -quit)" ]; then
            echo "ERROR: Instructor answer key detected inside _site!" >&2
            exit 1
          fi
          if [ -d "_site/kiberdrosibas-risinajumi-2-diena/structure" ]; then
            echo "ERROR: Internal structure/ folder detected inside _site!" >&2
            exit 1
          fi
          for f in \
            _site/index.html \
            _site/404.html \
            _site/.nojekyll \
            _site/kiberdrosibas-risinajumi-2-diena/index.html \
            _site/kiberdrosibas-risinajumi-2-diena/handouts/dalibnieku-darba-lapas.html
          do
            if [ ! -e "$f" ]; then
              echo "ERROR: Missing expected file: $f" >&2
              exit 1
            fi
            if [ "$f" != "_site/.nojekyll" ] && [ ! -s "$f" ]; then
              echo "ERROR: Expected non-empty file: $f" >&2
              exit 1
            fi
          done
          find _site -maxdepth 4 -type f | sort

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
